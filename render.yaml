services:
  - type: web
    name: framevox-links
    runtime: docker
    dockerfilePath: ./Dockerfile.link
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LINK_SERVER
        value: "1"
      - key: CORS_ORIGIN
        value: "*"    # any website may call it; each visitor is rate limited. Use your exact Vercel address to restrict.
